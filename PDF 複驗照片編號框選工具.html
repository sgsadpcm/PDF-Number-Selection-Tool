<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PDF 複驗照片編號框選工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  :root{--blue:#38bdf8;--blue2:#0ea5e9;--bg:#f3f6fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#d7dee8;}
  *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:1180px;margin:0 auto;padding:24px}.card{background:var(--card);border-radius:18px;box-shadow:0 10px 30px rgba(15,23,42,.08);padding:22px;margin-bottom:18px}
  h1{font-size:24px;margin:0 0 10px}.hint{color:var(--muted);line-height:1.6;margin:8px 0 16px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  input[type=file]{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;max-width:100%}textarea{width:100%;min-height:150px;border:1px solid #cbd5e1;border-radius:12px;padding:12px;font-size:16px;line-height:1.6;resize:vertical;background:#fff}
  button{border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;background:#e2e8f0;color:#0f172a}button.primary{background:#2563eb;color:#fff}button.good{background:#0ea5e9;color:#fff}button:disabled{opacity:.55;cursor:not-allowed}.status{font-weight:700;margin-top:12px;white-space:pre-wrap}.small{font-size:13px;color:var(--muted);line-height:1.6}.log{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:12px;max-height:220px;overflow:auto;white-space:pre-wrap;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}.pagecard{background:#fff;border-radius:18px;box-shadow:0 8px 24px rgba(15,23,42,.08);padding:14px;overflow:auto}.pagehead{font-weight:800;margin-bottom:8px}.badge{display:inline-block;background:#e0f2fe;color:#075985;border-radius:999px;padding:4px 10px;font-size:13px;margin-left:8px}.canvasWrap{position:relative;display:inline-block;border:1px solid var(--line);background:#fff}.canvasWrap canvas{display:block;max-width:100%;height:auto}.overlay{position:absolute;left:0;top:0;pointer-events:none}.notfound{color:#b91c1c}.ok{color:#0369a1}.warn{color:#b45309}.legend{display:inline-flex;align-items:center;gap:8px}.swatch{width:24px;height:16px;border:3px solid rgba(14,165,233,.9);background:rgba(56,189,248,.22);border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>PDF 複驗照片編號框選工具</h1>
    <div class="hint">
      上傳完整 PDF檢驗照片，輸入「未改善缺失項目之照片編號」。<br>
      支援「照片」與數字被 PDF 拆成不同文字片段、冒號/全形數字、空白換行差異，並避免 1 誤抓 11。
    </div>
    <div class="row">
      <input id="pdfFile" type="file" accept="application/pdf" />
      <span class="legend"><span class="swatch"></span>缺失標示為淺藍透明框</span>
    </div>
    <p class="small">可貼上：1, 2, 4-6 或 Excel、Word 複製的一整欄。照片 PDF 每個案場可不同，只要 PDF 內有可選取的「照片 N」文字層即可。</p>
    <textarea id="numbers" placeholder="例如：&#10;1&#10;11&#10;80&#10;252"></textarea>
    <div class="row" style="margin-top:14px">
      <button class="primary" id="previewBtn">預覽框選</button>
      <button class="good" id="downloadBtn" disabled>產生淺藍框選 PDF</button>
      <button id="clearBtn">清除結果</button>
      <button id="testBtn">測試：1,11,80</button>
    </div>
    <div id="status" class="status"></div>
    <p class="small">資料只在本機瀏覽器處理，不會上傳。若 PDF 是掃描圖檔且沒有文字層，需先 OCR。</p>
  </div>
  <div id="debugCard" class="card" style="display:none"><b>分析紀錄</b><div id="debug" class="log"></div></div>
  <div id="results" class="grid"></div>
</div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $ = id => document.getElementById(id);
let current = { fileBytes:null, pdf:null, overlays:[], foundMap:new Map(), missing:[], pageCanvases:new Map(), pageData:new Map() };

function normalizeDigits(s){
  const fw='０１２３４５６７８９';
  return String(s||'').replace(/[０-９]/g, d => String(fw.indexOf(d))).replace(/[\u00a0\u2000-\u200b\u202f\u3000]/g,' ');
}
function parseNumbers(text){
  const out = new Set();
  const src = normalizeDigits(text).replace(/[，、；;\t\n\r]+/g, ',');
  for(const part of src.split(',')){
    const p = part.trim(); if(!p) continue;
    const m = p.match(/^(\d+)\s*[-~～—]\s*(\d+)$/);
    if(m){ let a=+m[1], b=+m[2]; if(a>b)[a,b]=[b,a]; for(let i=a;i<=b;i++) out.add(i); }
    else { const nums = p.match(/\d+/g); if(nums) nums.forEach(n=>out.add(+n)); }
  }
  return [...out].filter(n=>Number.isInteger(n)&&n>0).sort((a,b)=>a-b);
}
function rectUnion(rects){
  const xs = rects.map(r=>r.x), ys=rects.map(r=>r.y), x2=rects.map(r=>r.x+r.w), y2=rects.map(r=>r.y+r.h);
  return {x:Math.min(...xs), y:Math.min(...ys), w:Math.max(...x2)-Math.min(...xs), h:Math.max(...y2)-Math.min(...ys)};
}
function escapeReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

function itemToChars(item, viewport){
  const str = normalizeDigits(item.str || '');
  if(!str) return [];
  const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
  const x = tx[4], baseY = tx[5];
  const w = Math.max(item.width || 0, 0.1);
  const h = Math.max(item.height || Math.abs(tx[3]) || 8, 6);
  const top = baseY - h;
  const chars = [...str];
  const per = w / Math.max(chars.length,1);
  return chars.map((ch,i)=>({ ch, x:x+i*per, y:top, w:per, h, pageYBase:baseY }));
}
function groupLines(chars){
  const sorted = chars.slice().sort((a,b)=> (a.y-b.y) || (a.x-b.x));
  const lines=[];
  for(const c of sorted){
    let line = lines.find(l => Math.abs(l.y - c.y) < Math.max(3, c.h*0.45));
    if(!line){ line={y:c.y, chars:[]}; lines.push(line); }
    line.chars.push(c); line.y = (line.y*(line.chars.length-1)+c.y)/line.chars.length;
  }
  for(const l of lines){ l.chars.sort((a,b)=>a.x-b.x); l.text = l.chars.map(c=>c.ch).join(''); l.flat = l.text.replace(/\s+/g,''); }
  return lines.sort((a,b)=>a.y-b.y);
}
function findLabelsInLine(line, wantedSet){
  const matches=[];
  // 直接在去空白後找「照片N」，並保留原 char 索引對應
  const map=[]; let compact='';
  line.chars.forEach((c,i)=>{ if(!/\s/.test(c.ch)){ map.push(i); compact += c.ch; } });
  // 支援「相片」誤植，但以照片為主
  const re = /(照片|相片)(\d{1,5})(?=\D|$)/g;
  let m;
  while((m = re.exec(compact))){
    const num = parseInt(m[2],10);
    if(!wantedSet.has(num)) continue;
    const startCompact = m.index;
    const endCompact = m.index + m[0].length - 1;
    const startIdx = map[startCompact], endIdx = map[endCompact];
    const rect = rectUnion(line.chars.slice(startIdx, endIdx+1).map(c=>({x:c.x,y:c.y,w:c.w,h:c.h})));
    matches.push({num, rect, source: compact.slice(m.index, m.index+m[0].length), lineText: line.text});
  }
  return matches;
}
async function analyzePdf(bytes, wanted){
  const pdf = await pdfjsLib.getDocument({data:bytes.slice(0)}).promise;
  const wantedSet = new Set(wanted);
  const foundMap = new Map(); const overlays=[]; const debug=[]; const pageData=new Map();
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const viewport = page.getViewport({scale:1});
    const text = await page.getTextContent({normalizeWhitespace:false, disableCombineTextItems:false});
    let chars=[];
    for(const item of text.items){ chars.push(...itemToChars(item, viewport)); }
    const lines = groupLines(chars);
    pageData.set(p, {viewport, lines});
    let pageHits=0;
    for(const line of lines){
      const hits = findLabelsInLine(line, wantedSet);
      for(const h of hits){
        const key = h.num;
        if(!foundMap.has(key)) foundMap.set(key, []);
        const padX = Math.max(4, h.rect.h*0.25), padY = Math.max(2.5, h.rect.h*0.18);
        const rect = {x:h.rect.x-padX, y:h.rect.y-padY, w:h.rect.w+padX*2, h:h.rect.h+padY*2};
        const hit = {num:h.num, page:p, rect, source:h.source, lineText:h.lineText, viewportWidth:viewport.width, viewportHeight:viewport.height};
        foundMap.get(key).push(hit); overlays.push(hit); pageHits++;
      }
    }
    if(pageHits) debug.push(`第 ${p} 頁找到 ${pageHits} 處`);
  }
  const missing = wanted.filter(n => !foundMap.has(n));
  return {pdf, overlays, foundMap, missing, pageData, debug};
}
async function renderPreviews(){
  $('results').innerHTML=''; current.pageCanvases.clear();
  const byPage = new Map();
  for(const o of current.overlays){ if(!byPage.has(o.page)) byPage.set(o.page, []); byPage.get(o.page).push(o); }
  for(const [pageNo, hits] of [...byPage.entries()].sort((a,b)=>a[0]-b[0])){
    const page = await current.pdf.getPage(pageNo);
    const baseViewport = page.getViewport({scale:1});
    const maxW = 680; const scale = Math.min(1.8, Math.max(1.1, maxW/baseViewport.width));
    const viewport = page.getViewport({scale});
    const canvas = document.createElement('canvas'); const ctx=canvas.getContext('2d');
    canvas.width = Math.floor(viewport.width); canvas.height = Math.floor(viewport.height);
    await page.render({canvasContext:ctx, viewport}).promise;
    const overlay = document.createElement('canvas'); overlay.className='overlay'; overlay.width=canvas.width; overlay.height=canvas.height;
    overlay.style.width=canvas.style.width; overlay.style.height=canvas.style.height;
    const ox=overlay.getContext('2d');
    ox.fillStyle='rgba(56,189,248,0.22)'; ox.strokeStyle='rgba(14,165,233,0.95)'; ox.lineWidth=3;
    for(const h of hits){
      ox.fillRect(h.rect.x*scale, h.rect.y*scale, h.rect.w*scale, h.rect.h*scale);
      ox.strokeRect(h.rect.x*scale, h.rect.y*scale, h.rect.w*scale, h.rect.h*scale);
    }
    const card=document.createElement('div'); card.className='pagecard';
    const nums=[...new Set(hits.map(h=>h.num))].sort((a,b)=>a-b).join(', ');
    card.innerHTML=`<div class="pagehead">第 ${pageNo} 頁 <span class="badge">${hits.length} 處</span><span class="badge">照片 ${nums}</span></div>`;
    const wrap=document.createElement('div'); wrap.className='canvasWrap'; wrap.appendChild(canvas); wrap.appendChild(overlay); card.appendChild(wrap);
    $('results').appendChild(card);
  }
}
async function makePdf(){
  if(!current.fileBytes || !current.overlays.length) return;
  const {PDFDocument, rgb} = PDFLib;
  const doc = await PDFDocument.load(current.fileBytes.slice(0));
  const pages = doc.getPages();
  for(const h of current.overlays){
    const page = pages[h.page-1]; if(!page) continue;
    const {width, height} = page.getSize();
    const sx = width / h.viewportWidth, sy = height / h.viewportHeight;
    const x = h.rect.x * sx;
    const y = height - ((h.rect.y + h.rect.h) * sy);
    const w = h.rect.w * sx;
    const hh = h.rect.h * sy;
    page.drawRectangle({x, y, width:w, height:hh, borderColor:rgb(0.05,0.55,0.85), color:rgb(0.22,0.74,0.97), opacity:0.22, borderOpacity:0.95, borderWidth:1.8});
  }
  const out = await doc.save();
  const blob = new Blob([out], {type:'application/pdf'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='照片編號淺藍框選_v4.pdf'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function clearAll(){ $('results').innerHTML=''; $('status').textContent=''; $('debug').textContent=''; $('debugCard').style.display='none'; $('downloadBtn').disabled=true; current.overlays=[]; current.foundMap=new Map(); current.missing=[]; }
async function run(){
  clearAll(); const f=$('pdfFile').files[0]; const wanted=parseNumbers($('numbers').value);
  if(!f){ $('status').innerHTML='<span class="notfound">請先選擇 PDF。</span>'; return; }
  if(!wanted.length){ $('status').innerHTML='<span class="notfound">請輸入要標的照片編號。</span>'; return; }
  $('previewBtn').disabled=true; $('status').textContent='分析 PDF 文字層中，請稍候…';
  try{
    const bytes = await f.arrayBuffer(); current.fileBytes=bytes;
    const res = await analyzePdf(bytes, wanted); Object.assign(current,res);
    const foundCount = wanted.filter(n=>current.foundMap.has(n)).length;
    const overlayCount = current.overlays.length;
    const miss = current.missing.join(', ');
    $('status').innerHTML = `輸入 ${wanted.length} 個編號；找到 ${foundCount} 個編號；框選 ${overlayCount} 處。` + (miss?`\n<span class="notfound">找不到：${miss}</span>`:'\n<span class="ok">全部找到。</span>') + `\n已完成預覽，確認正確後可按「產生淺藍框選 PDF」。`;
    $('debug').textContent = current.debug.join('\n') || '沒有找到符合的「照片 N」。'; $('debugCard').style.display='block';
    $('downloadBtn').disabled = !current.overlays.length;
    await renderPreviews();
  }catch(e){ console.error(e); $('status').innerHTML='<span class="notfound">處理失敗：'+(e.message||e)+'</span>'; }
  finally{ $('previewBtn').disabled=false; }
}
$('previewBtn').addEventListener('click', run); $('downloadBtn').addEventListener('click', makePdf); $('clearBtn').addEventListener('click', clearAll); $('testBtn').addEventListener('click',()=>{$('numbers').value='1\n11\n80';});
</script>
</body>
</html>
